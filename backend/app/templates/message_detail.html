{% extends 'base.html' %}
{% block content %}
<h2 class="page-title">Message</h2>
<p class="page-subtitle">Detailed view of the selected conversation item.</p>
{% if message %}
<div class="card p-4">
  <p><strong>From:</strong> {{ message.sender_name }}</p>
  <p><strong>To:</strong> {{ message.recipient_name }}</p>
  <p class="mb-0">{{ message.content|safe }}</p>
</div>
{% else %}
<div class="alert alert-warning" role="alert">
  Message not found.
  <a href="/messages" class="alert-link">Return to messages</a>
</div>
{% endif %}
{% endblock %}
